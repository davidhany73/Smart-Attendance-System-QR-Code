version: '3.8'

networks:
  attendance_network:
    driver: bridge

volumes:
  mysql_data:

services:

  db:
    image: mysql:8.0
    container_name: attendance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: attendance_db
      MYSQL_ROOT_HOST: "%"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - attendance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: attendance_backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: attendance_db
      SECRET_KEY: pharos_secret_2024
    ports:
      - "8080:5000"
    networks:
      - attendance_network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: attendance_frontend
    restart: always
    ports:
      - "8081:3000"  
    networks:
      - attendance_network
    depends_on:
      - backend